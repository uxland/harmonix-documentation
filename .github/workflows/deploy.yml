name: Deploy to IONOS via SFTP

on:
  push:
    branches:
      - master  # Deploys when changes are pushed to the main branch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies and build the site
      - name: Install and Build Docusaurus
        run: |
          yarn install
          yarn build


      # Step 4: Deploy via SFTP
      - name: Deploy to IONOS Server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
            username: acc1804162827
            server: home669771443.1and1-data.host
            port: 22
            local_path: './build/*'
            remote_path: '/harmonixframework'
            sftp_only: true
            password: ${{ secrets.SFTP_PASS }}

      # Step 5: The sftp glob above skips dotfiles, so the .htaccess of the Sandbox page (the
      # cross-origin isolation headers StackBlitz needs) is uploaded on its own. It lives inside
      # the sandbox folders, which only contain that page: nothing outside them is touched.
      - name: Deploy Sandbox headers (en)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
            username: acc1804162827
            server: home669771443.1and1-data.host
            port: 22
            local_path: './build/sandbox/.htaccess'
            remote_path: '/harmonixframework/sandbox/'
            sftp_only: true
            password: ${{ secrets.SFTP_PASS }}

      - name: Deploy Sandbox headers (ca)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
            username: acc1804162827
            server: home669771443.1and1-data.host
            port: 22
            local_path: './build/ca/sandbox/.htaccess'
            remote_path: '/harmonixframework/ca/sandbox/'
            sftp_only: true
            password: ${{ secrets.SFTP_PASS }}

      - name: Deploy Sandbox headers (es)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
            username: acc1804162827
            server: home669771443.1and1-data.host
            port: 22
            local_path: './build/es/sandbox/.htaccess'
            remote_path: '/harmonixframework/es/sandbox/'
            sftp_only: true
            password: ${{ secrets.SFTP_PASS }}
